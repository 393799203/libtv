server:
  port: 8080
  mode: debug  # debug / release

# CORS 允许来源白名单；为空时使用内置默认（localhost:5173/3000 等）
# 生产环境推荐通过环境变量 CORS_ORIGINS=http://a,http://b 覆盖
cors:
  origins:
    - http://localhost:5173
    - http://localhost:3000
    - http://192.168.110.115:8880
    - http://39.171.58.10:38880
    - http://yunqueai.cloud:38880
    - http://60.188.49.208:8880
    # 备案后正式域名上线时在此追加（http/https、www/无www 均需分别添加）

database:
  host: localhost
  port: 5432
  user: libtv
  password: libtv123
  dbname: libtv
  sslmode: disable

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

jwt:
  secret: "libtv-mvp-secret-change-in-production"
  expire_hours: 72

storage:
  type: fallback  # fallback / minio / local / zos (fallback=MinIO优先，失败降级local；zos=天翼云对象存储)
  local:
    base_path: ../public  # 与 getPublicDir 一致，匹配历史文件位置
  minio:
    endpoint: 192.168.110.207:9000  # 内网地址
    access_key: admin
    secret_key: password123
    bucket: libtv
    use_ssl: false
    public_endpoint: http://39.171.58.10:9990  # 公网访问地址（MinIO端口映射）
    check_interval: 30s  # 健康检查间隔
    check_timeout: 3s    # 健康检查超时
  # 天翼云对象存储 ZOS（官方兼容 AWS S3 协议，用 minio-go 客户端对接即可）
  # 启用：type 改为 zos，或保持 fallback（配了下方 zos 配置后 fallback 自动优先 ZOS、本地降级）
  # endpoint：控制台"终端节点（Endpoint）"，不带协议（use_ssl 决定 https）
  # public_endpoint：控制台"Bucket外网访问"域名（虚拟主机风格，bucket 已在子域中，勿再拼 /bucket/）
  zos:
    endpoint: huadong-1.ctyunzos.cn   # 天翼云 ZOS 终端节点
    access_key: ""                    # AccessKey ID（天翼云控制台-访问密钥；生产建议用环境变量注入）
    secret_key: ""                    # AccessKey Secret
    bucket: manwa
    use_ssl: true                     # endpoint 为 https 时 true
    public_endpoint: https://manwa.huadong-1.ctyunzos.cn  # Bucket 外网访问域名（虚拟主机风格）
    check_interval: 30s               # 健康检查间隔

ai:
  # ---- Provider 运行时凭据（对应 models.yaml 中的 providers）----
  providers:
    wasu:
      api_key: "sk-jHYp7jAAqZLqLGUffjHrLZBtGaIhLjexdjesHLpq5S84qpC4"
      base_url: "https://token.wasu.cn/v1"
    dianxin:
      api_key: "d15dd4bcdf524c0d91c39329cbe3a405"
      base_url: "https://ai.ctaigw.cn/v1"

# ============================================
#  支付（积分超市支付宝充值；默认关闭，配置并置 enabled: true 后生效）
#  密钥/回调地址建议用环境变量 ALIPAY_* 注入，避免明文提交
# ============================================
payment:
  alipay:
    enabled: false
    app_id: ""
    private_key: ""          # RSA2 应用私钥 PEM（PKCS1/PKCS8）；环境变量 ALIPAY_PRIVATE_KEY
    alipay_public_key: ""    # 支付宝公钥 PEM（PKIX）；环境变量 ALIPAY_PUBLIC_KEY
    gateway: "https://openapi.alipay.com/gateway.do"   # 沙箱联调改 https://openapi-sandbox.dl.alipaydev.com/gateway.do
    notify_url: ""           # 异步回调（公网可达）；环境变量 ALIPAY_NOTIFY_URL
    return_url: ""           # 同步跳转；环境变量 ALIPAY_RETURN_URL
    subject_prefix: "漫蛙AI积分"
