database:
  host: localhost
  port: 5432
  user: libtv
  password: libtv123
  dbname: libtv
  sslmode: disable

# Redis：限流 / 生成并发闸门 / 任务队列。
# 属增强能力而非硬依赖 —— 连不上时自动降级（限流关闭、生成任务回到进程内执行），不阻断生成。
# Docker 内使用服务名 redis；本地开发改为 localhost
redis:
  host: redis
  port: 6379
  password: "libtv-redis-2026"   # 需与 docker-compose.yml 中 redis 的 --requirepass 一致
  db: 0

# 生成任务队列（Redis Stream）
#   • 进程重启不丢任务：未确认的消息在下次启动时由 XAUTOCLAIM 认领续跑
#     （原实现是裸 goroutine，重启即丢，执行会永久卡在 running 但积分已扣）
#   • 失败按指数退避重试（30s→1m→2m→4m），超出次数进死信流便于排查/重放
#   • workers 即全局并发闸门：同时最多这么多个任务在跑，保护上游网关
# 注意：被中断的任务重跑时会重新执行计划内节点。失败节点本身已退费，
#       但同一计划中先前已成功的节点会被重新扣费，故 max_retry 保守设为 1。
queue:
  enabled: true
  workers: 10                    # 同时消费的任务数 = 全局生成并发上限
  max_retry: 1                  # 失败重试次数（超出转死信流）
  stream: "libtv:gen:tasks"
  dead_stream: "libtv:gen:dead"
  consumer_group: "libtv:gen"
  # 租约时长（同时是「处理中锁 TTL」与「reclaim 认定 worker 失联的 idle 阈值」）。
  # worker 执行期间会**定期续租**（延长锁 + 重置消息 idle，见 startLeaseRenewal），
  # 所以长任务（视频轮询最长 25 分钟）不会被误判失联；而 worker 真死掉时，
  # 最长一个租约周期就会被 reclaim 认领续跑 —— 续租之前的问题正是「没有续租」，
  # 于是跑超租约的执行会被抢走并与原 worker 并发重跑（重复扣费/重复退费）。
  visibility_timeout_sec: 900

# 视频生成（上游异步任务）轮询预算
#   • 轮询 = 每 poll_interval_sec 查一次上游任务状态，直到出片或超时
#   • poll_timeout_sec 必须显著小于执行超时（handler 的 executionTimeout = 30 分钟 = 1800s），
#     否则执行 ctx 先到期，失败退费与画布收尾只能走 deadline 路径
#   • 历史实现固定 10 分钟（120 次 × 5s）：慢视频（长/多参考、高分辨率）常需 10~25 分钟，
#     到点即整单作废；这里默认 25 分钟，留 5 分钟给退费与收尾
video:
  poll_interval_sec: 5
  poll_timeout_sec: 1500        # 25 分钟

# 生成接口限流（防狂点）
ratelimit:
  enabled: true
  per_minute: 10                # 每用户每分钟最多发起 10 次生成（0 = 不限制）

jwt:
  secret: "libtv-mvp-secret-change-in-production"
  expire_hours: 24

storage:
  type: fallback  # fallback / minio / local / zos (fallback=MinIO优先，失败降级local；zos=天翼云对象存储)
  local:
    base_path: ../public  # 与 getPublicDir 一致，匹配历史文件位置
  minio:
    endpoint: 192.168.110.207:9000  # 内网地址
    access_key: admin
    secret_key: password123
    bucket: libtv
    use_ssl: false
    public_endpoint: http://39.171.58.10:9990  # 公网访问地址（MinIO端口映射）
    check_interval: 30s  # 健康检查间隔
    check_timeout: 3s    # 健康检查超时
  # 天翼云对象存储 ZOS（官方兼容 AWS S3 协议，用 minio-go 客户端对接即可）
  # 启用：type 改为 zos，或保持 fallback（配了下方 zos 配置后 fallback 自动优先 ZOS、本地降级）
  # endpoint：控制台"终端节点（Endpoint）"，不带协议（use_ssl 决定 https）
  # public_endpoint：控制台"Bucket外网访问"域名（虚拟主机风格，bucket 已在子域中，勿再拼 /bucket/）
  zos:
    endpoint: huadong-1.ctyunzos.cn   # 天翼云 ZOS 终端节点
    access_key: ""                    # AccessKey ID（天翼云控制台-访问密钥；生产建议用环境变量注入）
    secret_key: ""                    # AccessKey Secret
    bucket: manwa
    use_ssl: true                     # endpoint 为 https 时 true
    public_endpoint: https://manwa.huadong-1.ctyunzos.cn  # Bucket 外网访问域名（虚拟主机风格）
    check_interval: 30s               # 健康检查间隔

