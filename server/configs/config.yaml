server:
  port: 8080
  mode: debug  # debug / release

# CORS 允许来源白名单；为空时使用内置默认（localhost:5173/3000 等）
# 生产环境推荐通过环境变量 CORS_ORIGINS=http://a,http://b 覆盖
cors:
  origins:
    - http://localhost:5173
    - http://localhost:3000
    - http://192.168.110.115:8880
    - http://39.171.58.10:38880
    - http://yunqueai.cloud:38880

database:
  host: localhost
  port: 5432
  user: libtv
  password: libtv123
  dbname: libtv
  sslmode: disable

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

jwt:
  secret: "libtv-mvp-secret-change-in-production"
  expire_hours: 72

storage:
  type: local  # fallback / minio / local (本地开发使用local)
  local:
    base_path: ../public  # 与 getPublicDir 一致，匹配历史文件位置
  minio:
    endpoint: 192.168.110.207:9000  # 内网地址
    access_key: admin
    secret_key: password123
    bucket: libtv
    use_ssl: false
    public_endpoint: http://39.171.58.10:9990  # 公网访问地址（MinIO端口映射）
    check_interval: 30s  # 健康检查间隔
    check_timeout: 3s    # 健康检查超时

ai:
  # ---- Provider 运行时凭据（对应 models.yaml 中的 providers）----
  providers:
    siliconflow:
      api_key: "sk-qahniunuynslawucpjnjirhzlfglbmdogyaftrntsrpypcjt"
      base_url: "https://api.siliconflow.cn/v1"
    openai:
      api_key: ""
      base_url: "https://api.openai.com/v1"
    qwen:
      api_key: ""
      base_url: ""

  # ---- LLM 默认配置（向后兼容）----
  llm:
    provider: siliconflow
    api_key: ""  # 优先使用 providers.<name>.api_key
    base_url: ""
    model: "deepseek-ai/DeepSeek-V4-Flash"
  image:
    provider: sd_webui  # sd_webui / comfyui
    api_url: "http://localhost:7860"
  video:
    provider: kling  # kling / seedance
    api_key: ""
    api_url: ""
  audio:
    provider: edge_tts  # edge_tts / fish_speech
