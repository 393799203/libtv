# ============================================
#  统一模型配置文件 (Model Registry) - 按渠道分 section
# ============================================
# models.wasu     华数渠道：完整独立模型清单
# models.dianxin  电信渠道：完整独立模型清单（模型 ID/名称与华数完全独立，零映射）
# 计费：model_prices 表按各渠道模型自己的 id 分别配置价格（后台价格管理按渠道 tab 维护）
# 实际调用凭据（api_key 等）放在 config.yaml 的 ai.providers 中
models:
  wasu:  # 华数渠道
    # ---------- llm ----------
    llm:
      - id: deepseek-v4-flash
        name: "DeepSeek V4 Flash"
        provider: wasu
        model_id: "deepseek-v4-flash"
        usage: [text, script]
        max_tokens: 8192
        temperature: 0.7
        description: "DeepSeek V4 Flash，适合文本生成、剧本分镜和提示词生成"
        default: true  # 默认选中此模型

      - id: deepseek-v4-pro
        name: "DeepSeek V4 Pro"
        provider: wasu
        model_id: "deepseek-v4-pro"
        usage: [text, script]
        max_tokens: 8192
        temperature: 0.7
        description: "DeepSeek V4 Pro，推理能力更强，适合复杂剧本和提示词生成"

      - id: qwen3.7-plus
        name: "Qwen 3.7 Plus"
        provider: wasu
        model_id: "qwen3.7-plus"
        usage: [text, script]
        max_tokens: 8192
        temperature: 0.7
        description: "通义千问3.7增强版，中文能力强"

      - id: qwen3.7-max
        name: "Qwen 3.7 Max"
        provider: wasu
        model_id: "qwen3.7-max"
        usage: [text, script]
        max_tokens: 8192
        temperature: 0.7
        description: "通义千问3.7旗舰版，推理与创作能力最强"

      - id: glm-5.2
        name: "GLM-5.2"
        provider: wasu
        model_id: "glm-5.2"
        usage: [text, script]
        max_tokens: 8192
        temperature: 0.7
        description: "智谱GLM-5.2，综合能力均衡"

      - id: glm-5.2-fast-preview
        name: "GLM-5.2 Fast"
        provider: wasu
        model_id: "glm-5.2-fast-preview"
        usage: [text, script]
        max_tokens: 8192
        temperature: 0.7
        description: "智谱GLM-5.2快速预览版，响应更快"

      - id: doubao-seed-2.1-pro
        name: "Seed 2.1 Pro"
        provider: wasu
        model_id: "doubao-seed-2.1-pro"
        usage: [text, script]
        max_tokens: 8192
        temperature: 0.7
        description: "字节Seed 2.1 Pro，综合能力强"

      - id: doubao-seed-2.1-turbo
        name: "Seed 2.1 Turbo"
        provider: wasu
        model_id: "doubao-seed-2.1-turbo"
        usage: [text, script]
        max_tokens: 8192
        temperature: 0.7
        description: "字节Seed 2.1 Turbo，快速响应"

    # ---------- image ----------
    image:
      - id: qwen-image-3.0
        name: "Qwen Image 3.0"
        provider: wasu
        model_id: "qwen-image-3.0"
        usage: [image, character, scene, prop]
        max_tokens: 2048
        temperature: 0.7
        description: "通义千问图像3.0，适合角色/场景/道具图生成"
        parameters:
          width: 1920
          height: 1080

      - id: qwen-image-3.0-pro
        name: "Qwen Image 3.0 Pro"
        provider: wasu
        model_id: "qwen-image-3.0-pro"
        usage: [image, character, scene, prop]
        max_tokens: 2048
        temperature: 0.7
        description: "通义千问图像3.0专业版，画质更高"

      - id: wan2.7-image
        name: "Wan 2.7 Image"
        provider: wasu
        model_id: "wan2.7-image"
        usage: [image, character, scene, prop]
        max_tokens: 2048
        temperature: 0.7
        description: "万象2.7图像生成，适合创意图像生成"

      - id: wan2.7-image-pro
        name: "Wan 2.7 Image Pro"
        provider: wasu
        model_id: "wan2.7-image-pro"
        usage: [image, character, scene, prop]
        max_tokens: 2048
        temperature: 0.7
        description: "万象2.7图像专业版，画质更高"

      - id: doubao-seedream-4.5
        name: "Seedream 4.5"
        provider: wasu
        model_id: "doubao-seedream-4.5"
        usage: [image, character, scene, prop]
        max_tokens: 2048
        temperature: 0.7
        description: "字节Seedream 4.5，画质提升"

      - id: doubao-seedream-5.0-lite
        name: "Seedream 5.0 Lite"
        provider: wasu
        model_id: "doubao-seedream-5.0-lite"
        usage: [image, character, scene, prop]
        max_tokens: 2048
        temperature: 0.7
        description: "字节Seedream 5.0轻量版，生成速度快"
        default: true  # 默认选中此模型

      - id: doubao-seedream-5.0-pro
        name: "Seedream 5.0 Pro"
        provider: wasu
        model_id: "doubao-seedream-5.0-pro"
        usage: [image, character, scene, prop]
        max_tokens: 2048
        temperature: 0.7
        description: "字节Seedream 5.0专业版，画质最高"

    # ---------- video ----------
    video:
      - id: doubao-seedance-2.0
        name: "Seedance 2.0"
        provider: wasu
        model_id: "doubao-seedance-2.0"
        usage: [video]
        temperature: 0
        description: "字节Seedance 2.0视频生成"
        resolutions: ["480p", "720p", "1080p", "4k"]

      - id: doubao-seedance-2.0-fast
        name: "Seedance 2.0 Fast"
        provider: wasu
        model_id: "doubao-seedance-2.0-fast"
        usage: [video]
        temperature: 0
        description: "字节Seedance 2.0快速版，生成速度更快"
        resolutions: ["480p", "720p"]

      - id: doubao-seedance-2.5
        name: "Seedance 2.5"
        provider: wasu
        model_id: "doubao-seedance-2.5"
        usage: [video]
        temperature: 0
        description: "字节Seedance 2.5视频生成，长叙事能力强，擅长多镜头连贯剧情与复杂运镜"
        resolutions: ["480p", "720p", "1080p"]

      - id: wan3.0-video
        name: "Wan 3.0"
        provider: wasu
        model_id: "wan3.0-video"
        usage: [video]
        temperature: 0
        description: "阿里Wan 3.0全能参考视频生成，最长30秒"
        resolutions: ["480p", "720p", "1080p"]

    # ---------- audio ----------
    audio:
      - id: qwen3-tts-instruct-flash
        name: "Qwen3 TTS Flash"
        provider: wasu
        model_id: "qwen3-tts-instruct-flash"
        usage: [audio]
        temperature: 0
        description: "通义千问Qwen3 TTS指令版快速模型，支持多音色语音合成"

  dianxin:  # 电信渠道（天翼云；模型逐个补充中）
    # ---------- llm ----------
    llm:
      - id: deepseek-v4.1-flash
        name: "DeepSeek V4.1 Flash"
        provider: dianxin
        model_id: "deepseek-v4.1-flash"
        usage: [text, script]
        max_tokens: 8192
        temperature: 0.7
        description: "DeepSeek V4.1 Flash（电信天翼云渠道），适合文本生成、剧本分镜和提示词生成"
        default: true  # 默认选中此模型

    # ---------- image ----------
    image:
    # ---------- video ----------
    video:
    # ---------- audio ----------
    audio:

