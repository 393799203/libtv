# ============================================
#  统一模型配置文件 (Model Registry)
# ============================================
# 定义所有可用模型及其归属的 Provider。
# 实际调用凭据（api_key 等）放在 config.yaml 的 ai.providers 中。

models:
  # ---------- LLM / 文本生成 ----------
  llm:
    # 剧本生成（文本节点 → 脚本节点）
    - id: script-default
      name: "DeepSeek V4 Flash"
      provider: siliconflow
      model_id: "deepseek-ai/DeepSeek-V4-Flash"
      usage: [script]
      max_tokens: 8192
      temperature: 0.7
      description: "硅基流动 DeepSeek-V4-Flash，适合剧本分镜生成"

    # 通用文本（预留）
    - id: text-general
      name: "DeepSeek V4 Flash"
      provider: siliconflow
      model_id: "deepseek-ai/DeepSeek-V4-Flash"
      usage: [text]
      max_tokens: 4096
      temperature: 0.7
      description: "硅基流动 DeepSeek-V4-Flash，适合文本生成"

    # 图像提示词优化（预留）
    - id: prompt-refine
      name: "DeepSeek V4 Flash"
      provider: siliconflow
      model_id: "deepseek-ai/DeepSeek-V4-Flash"
      usage: [image_prompt, video_prompt]
      max_tokens: 2048
      temperature: 0.5
      description: "硅基流动 DeepSeek-V4-Flash，适合图像/视频提示词优化"

  # ---------- 图像生成 ----------
  image:
    - id: kolors-default
      name: "Kwai-Kolors/Kolors"
      provider: siliconflow
      model_id: "Kwai-Kolors/Kolors"
      usage: [image, character, scene, prop]
      max_tokens: 2048
      temperature: 0.7
      description: "硅基流动 Kwai-Kolors/Kolors 图像生成模型，适合角色/场景/道具图生成"
      parameters:
        width: 1280   # ✅ 默认 16:9 比例，适合视频分镜场景
        height: 720
        steps: 25
        guidance_scale: 7.5

    - id: seedream-5.0-lite
      name: "Doubao-Seedream-5.0-lite"
      provider: siliconflow
      model_id: "doubao/seedream-5.0-lite"
      usage: [image, character, scene, prop]
      max_tokens: 2048
      temperature: 0.7
      description: "字节豆包图像生成模型，适合角色/场景/道具图生成"
      parameters:
        width: 1280   # ✅ 默认 16:9 比例，适合视频分镜场景
        height: 720
        steps: 25
        guidance_scale: 7.5

    - id: qwen-image
      name: "Qwen/Qwen-Image"
      provider: siliconflow
      model_id: "Qwen/Qwen-Image"
      usage: [image, character, scene, prop]
      max_tokens: 2048
      temperature: 0.7
      description: "通义千问图像生成模型，适合角色/场景/道具图生成"
      parameters:
        width: 1280   # ✅ 默认 16:9 比例，适合视频分镜场景
        height: 720
        steps: 25
        guidance_scale: 7.5

    - id: z-image-turbo
      name: "Tongyi-MAI/Z-Image-Turbo"
      provider: siliconflow
      model_id: "Tongyi-MAI/Z-Image-Turbo"
      usage: [image, character, scene, prop]
      max_tokens: 2048
      temperature: 0.7
      description: "阿里通义图像生成模型，适合角色/场景/道具图生成"
      parameters:
        width: 1280   # ✅ 默认 16:9 比例，适合视频分镜场景
        height: 720
        steps: 25
        guidance_scale: 7.5

  # ---------- 视频生成（预留）----------
  video:
    - id: video-default
      name: "Kling 2.0"
      provider: kling
      model_id: "kling-2.0"
      usage: [video]

  # ---------- 音频 / TTS（预留）----------
  audio:
    - id: audio-default
      name: "Edge TTS"
      provider: edge_tts
      model_id: "edge-tts"
      usage: [audio]


# ============================================
#  Provider 定义（运行时凭据在 config.yaml）
# ============================================
providers:
  siliconflow:
    type: openai_compatible
    base_url_template: "https://api.siliconflow.cn/v1"

  openai:
    type: openai_compatible
    base_url_template: "https://api.openai.com/v1"

  qwen:
    type: openai_compatible
    base_url_template: "https://dashscope.aliyuncs.com/compatible-mode/v1"

  lib_image:
    type: custom
    base_url_template: ""

  kling:
    type: custom
    base_url_template: ""

  edge_tts:
    type: local
    base_url_template: ""
