# ============================================
#  统一模型配置文件 (Model Registry)
# ============================================
# 定义所有可用模型及其归属的 Provider。
# 实际调用凭据（api_key 等）放在 config.yaml 的 ai.providers 中。

models:
  # ---------- LLM / 文本生成 ----------
  llm:
    # DeepSeek V4 Flash - 华数TokenHub接入，支持文本生成、剧本分镜、提示词生成
    - id: deepseek-v4-flash
      name: "DeepSeek V4 Flash"
      provider: wasu
      model_id: "deepseek-v4-flash"
      usage: [text, script]  # ✅ 同时支持文本节点和脚本节点
      max_tokens: 8192       # ✅ 使用更大的 tokens，兼容剧本生成需求
      temperature: 0.7
      description: "DeepSeek V4 Flash（华数TokenHub），适合文本生成、剧本分镜和提示词生成"
      default: true          # ✅ 默认选中此模型

    - id: deepseek-v4-pro
      name: "DeepSeek V4 Pro"
      provider: wasu
      model_id: "deepseek-v4-pro"
      usage: [text, script]
      max_tokens: 8192
      temperature: 0.7
      description: "DeepSeek V4 Pro（华数TokenHub），推理能力更强，适合复杂剧本和提示词生成"

    - id: qwen3.6-plus
      name: "Qwen 3.6 Plus"
      provider: wasu
      model_id: "qwen3.6-plus"
      usage: [text, script]
      max_tokens: 8192
      temperature: 0.7
      description: "通义千问3.6增强版（华数TokenHub），中文能力强"

    - id: qwen3.6-flash
      name: "Qwen 3.6 Flash"
      provider: wasu
      model_id: "qwen3.6-flash"
      usage: [text, script]
      max_tokens: 8192
      temperature: 0.7
      description: "通义千问3.6快速版（华数TokenHub），响应速度快"

    - id: glm-5.1
      name: "GLM-5.1"
      provider: wasu
      model_id: "glm-5.1"
      usage: [text, script]
      max_tokens: 8192
      temperature: 0.7
      description: "智谱GLM-5.1（华数TokenHub），综合能力均衡"

    - id: kimi-k2.6
      name: "Kimi K2.6"
      provider: wasu
      model_id: "kimi-k2.6"
      usage: [text, script]
      max_tokens: 8192
      temperature: 0.7
      description: "Kimi K2.6（华数TokenHub），长文本理解能力强"

    - id: doubao-seed-2.0-pro
      name: "豆包 Seed 2.0 Pro"
      provider: wasu
      model_id: "doubao-seed-2.0-pro"
      usage: [text, script]
      max_tokens: 8192
      temperature: 0.7
      description: "字节豆包Seed 2.0 Pro（华数TokenHub），综合能力强"

    - id: doubao-seed-2.0-lite
      name: "豆包 Seed 2.0 Lite"
      provider: wasu
      model_id: "doubao-seed-2.0-lite"
      usage: [text, script]
      max_tokens: 8192
      temperature: 0.7
      description: "字节豆包Seed 2.0 Lite（华数TokenHub），轻量快速"

    - id: doubao-seed-2.0-mini
      name: "豆包 Seed 2.0 Mini"
      provider: wasu
      model_id: "doubao-seed-2.0-mini"
      usage: [text, script]
      max_tokens: 8192
      temperature: 0.7
      description: "字节豆包Seed 2.0 Mini（华数TokenHub），极速轻量"

  # ---------- 图像生成（华数TokenHub）----------
  image:
    - id: qwen-image-2.0
      name: "Qwen Image 2.0"
      provider: wasu
      model_id: "qwen-image-2.0"
      usage: [image, character, scene, prop]
      max_tokens: 2048
      temperature: 0.7
      description: "通义千问图像2.0（华数TokenHub），适合角色/场景/道具图生成"
      parameters:
        width: 1920   # ✅ 16:9 比例，适合视频分镜场景
        height: 1080

    - id: qwen-image-2.0-pro
      name: "Qwen Image 2.0 Pro"
      provider: wasu
      model_id: "qwen-image-2.0-pro"
      usage: [image, character, scene, prop]
      max_tokens: 2048
      temperature: 0.7
      description: "通义千问图像2.0专业版（华数TokenHub），画质更高"

    - id: wan2.7-image
      name: "Wan 2.7 Image"
      provider: wasu
      model_id: "wan2.7-image"
      usage: [image, character, scene, prop]
      max_tokens: 2048
      temperature: 0.7
      description: "万象2.7图像生成（华数TokenHub），适合创意图像生成"

    - id: wan2.7-image-pro
      name: "Wan 2.7 Image Pro"
      provider: wasu
      model_id: "wan2.7-image-pro"
      usage: [image, character, scene, prop]
      max_tokens: 2048
      temperature: 0.7
      description: "万象2.7图像专业版（华数TokenHub），画质更高"

    - id: doubao-seedream-4.0
      name: "豆包 Seedream 4.0"
      provider: wasu
      model_id: "doubao-seedream-4.0"
      usage: [image, character, scene, prop]
      max_tokens: 2048
      temperature: 0.7
      description: "字节豆包Seedream 4.0（华数TokenHub），综合图像生成"

    - id: doubao-seedream-4.5
      name: "豆包 Seedream 4.5"
      provider: wasu
      model_id: "doubao-seedream-4.5"
      usage: [image, character, scene, prop]
      max_tokens: 2048
      temperature: 0.7
      description: "字节豆包Seedream 4.5（华数TokenHub），画质提升"

    - id: doubao-seedream-5.0-lite
      name: "豆包 Seedream 5.0 Lite"
      provider: wasu
      model_id: "doubao-seedream-5.0-lite"
      usage: [image, character, scene, prop]
      max_tokens: 2048
      temperature: 0.7
      description: "字节豆包Seedream 5.0轻量版（华数TokenHub），生成速度快"
      default: true  # ✅ 默认选中此模型

  # ---------- 视频生成 ----------
  video:
    - id: doubao-seedance-2.0
      name: "豆包 Seedance 2.0"
      provider: wasu
      model_id: "doubao-seedance-2.0"
      usage: [video]
      description: "字节豆包Seedance 2.0视频生成（华数TokenHub）"
      resolutions: ["480p", "720p", "1080p", "4k"]
    - id: doubao-seedance-2.0-fast
      name: "豆包 Seedance 2.0 Fast"
      provider: wasu
      model_id: "doubao-seedance-2.0-fast"
      usage: [video]
      description: "字节豆包Seedance 2.0快速版（华数TokenHub），生成速度更快"
      resolutions: ["480p", "720p"]

  # ---------- 音频 / TTS ----------
  audio:
    - id: qwen3-tts-instruct-flash
      name: "Qwen3 TTS Flash"
      provider: wasu
      model_id: "qwen3-tts-instruct-flash"
      usage: [audio]
      description: "通义千问Qwen3 TTS指令版快速模型（华数TokenHub），支持多音色语音合成"


# ============================================
#  Provider 定义（运行时凭据在 config.yaml）
# ============================================
providers:
  wasu:
    type: openai_compatible
    base_url_template: "https://token.wasu.cn/v1"

  deepseek:
    type: openai_compatible
    base_url_template: "https://api.deepseek.com/v1"

  openai:
    type: openai_compatible
    base_url_template: "https://api.openai.com/v1"

  qwen:
    type: openai_compatible
    base_url_template: "https://dashscope.aliyuncs.com/compatible-mode/v1"

  lib_image:
    type: custom
    base_url_template: ""

  kling:
    type: custom
    base_url_template: ""

  edge_tts:
    type: local
    base_url_template: ""
