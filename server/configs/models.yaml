# ============================================
#  统一模型配置文件 (Model Registry) - 按渠道分 section
# ============================================
# models.dianxin 电信渠道：唯一启用的模型清单
# 计费：model_prices 表按电信模型 ID 配置价格；旧渠道价格仅用于历史追溯
# 实际调用凭据（api_key 等）放在 config.yaml 的 ai.providers 中
models:
  dianxin:  # 电信渠道（天翼云；模型逐个补充中）
    # ---------- llm ----------
    llm:
      - id: deepseek-v4.1-flash
        name: "DeepSeek V4.1 Flash"
        provider: dianxin
        model_id: "deepseek-v4.1-flash"
        usage: [text, script, previz]  # previz=白模场景解析（多模态，支持图片理解）
        max_tokens: 8192
        temperature: 0.7
        description: "DeepSeek V4.1 Flash（多模态），支持图片理解，可用于文本、剧本分镜与白模场景解析"
        default: true  # 默认选中此模型

      - id: glm-5.3-flash
        name: "GLM-5.3 Flash"
        provider: dianxin
        model_id: "glm-5.3-flash"
        usage: [text, script, previz]  # previz=白模场景解析（多模态，支持图片输入）
        max_tokens: 8192
        temperature: 0.7
        description: "GLM-5.3 Flash（多模态），支持图片理解，可用于白模场景解析、文本与分镜生成"

      - id: deepseek-v4-flash-0731
        name: "DeepSeek V4 Flash"
        provider: dianxin
        model_id: "deepseek-v4-flash-0731"
        usage: [text, script]
        max_tokens: 8192
        temperature: 0.7
        description: "DeepSeek V4 Flash（电信侧 0731 版本），适合文本生成、剧本分镜和提示词生成"

    # ---------- image ----------
    # 价格按渠道独立存储（model_prices.channel），模型清单与华数独立；
    # 调用时按渠道路由 token，计费按渠道取价
    image:
      - id: doubao-seedream-5.0-flash
        name: "Seedream 5.0 Flash"
        provider: dianxin
        model_id: "doubao-seedream-5.0-flash"
        usage: [image, character, scene, prop]
        resolutions: ["2K"]
        max_tokens: 2048
        temperature: 0.7
        description: "Seedream 5.0 Flash"
        default: true

      - id: doubao-seedream-5.5
        name: "Seedream 5.5"
        provider: dianxin
        model_id: "doubao-seedream-5.5"
        usage: [image, character, scene, prop]
        resolutions: ["2K"]
        max_tokens: 2048
        temperature: 0.7
        description: "Seedream 5.5"

      - id: doubao-seedream-5.0-pro
        name: "Seedream 5.0 Pro"
        provider: dianxin
        model_id: "doubao-seedream-5.0-pro"
        usage: [image, character, scene, prop]
        resolutions: ["2K", "4K"]
        max_tokens: 2048
        temperature: 0.7
        description: "Seedream 5.0 Pro，画质与细节更强（支持文生图与图生图）"

      # 阿里 Qwen-Image 2.0 Pro：**协议与上面 Seedream 模型不同**，
      # 走 DashScope 多模态生成（api_style 见下），不是 OpenAI 兼容的 /images/generations。
      #
      # 只给 1K/2K 两个档：上游限制单张图面积 262144(512x512)~4194304(2048x2048) 像素，
      # 而 4K 档 = 3840x2160 = 829万像素，必然被上游 400 拒单 —— 列出来等于给用户一个
      # 点了就失败的按钮。image.go 里另有兜底缩放，防老画布残留 4K。
      - id: qwen-image-2.0-pro
        name: "Qwen Image 2.0 Pro"
        provider: dianxin
        model_id: "qwen-image-2.0-pro"
        usage: [image, character, scene, prop]
        resolutions: ["1K", "2K"]
        max_tokens: 2048
        temperature: 0.7
        # 协议风格：空 = OpenAI 兼容 /images/generations；dashscope-multimodal = 多模态生成接口
        api_style: dashscope-multimodal
        description: "通义千问图像2.0专业版，支持多参考图融合与指令编辑（最高 2K）"

    # ---------- video ----------
    video:
      - id: cdance2.0-0807
        name: "Seedance 2.0"
        provider: dianxin
        model_id: "cdance2.0-0807"
        usage: [video]
        description: "Seedance 2.0（cdance2.0-0807，异步任务接口）"
        resolutions: ["480p", "720p", "1080p"]
        duration_range: [4, 15]
        ref_video_billing: true   # 带参考视频输入时按「输入时长 + 输出时长」计费，单价走「带参考视频」档（6 折预设）

      - id: cdance2.0-fast-0807
        name: "Seedance 2.0 Fast"
        provider: dianxin
        model_id: "cdance2.0-fast-0807"
        usage: [video]
        description: "Seedance 2.0 Fast（cdance2.0-fast-0807，生成更快）"
        resolutions: ["480p", "720p"]
        duration_range: [4, 15]
        ref_video_billing: true   # 带参考视频输入时按「输入时长 + 输出时长」计费，单价走「带参考视频」档（6 折预设）

      - id: cdance2.5-0807
        name: "Seedance 2.5"
        provider: dianxin
        model_id: "cdance2.5-0807"
        usage: [video]
        description: "Seedance 2.5（cdance2.5-0807，异步任务接口，长叙事与多镜头连贯能力更强）"
        resolutions: ["480p", "720p", "1080p"]
        duration_range: [4, 30]
        ref_video_billing: true   # 带参考视频输入时按「输入时长 + 输出时长」计费，单价走「带参考视频」档（6 折预设）

      # 与华数同名（wan3.0-video），靠渠道区分 token 与价格；
      # 电信侧走 DashScope 异步协议，与上面 cdance 系列（火山协议）实现不同
      - id: wan3.0-video
        name: "Wan 3.0 Video"
        provider: dianxin
        model_id: "wan3.0-video"
        usage: [video]
        temperature: 0
        description: "通义万相 3.0 视频（DashScope 异步协议，支持 2-30 秒长视频）"
        resolutions: ["480p", "720p", "1080p"]
        duration_range: [2, 30]
        # 未开启 ref_video_billing：参考视频不参与计费（仍按常规单价 × 输出时长）

    # ---------- audio ----------
    audio:
      - id: minimax-speech-2.8-turbo
        name: "MiniMax Speech 2.8 Turbo"
        provider: dianxin
        model_id: "minimax-speech-2.8-turbo"
        usage: [audio]
        temperature: 0
        description: "MiniMax Speech 2.8 Turbo"
        default: true

      - id: minimax-speech-2.8-hd
        name: "MiniMax Speech 2.8 HD"
        provider: dianxin
        model_id: "minimax-speech-2.8-hd"
        usage: [audio]
        temperature: 0
        description: "MiniMax Speech 2.8 HD"

