# ============================================
#  清晰化渠道配置（Enhance Channels）
# ============================================
# 这个文件只描述「开放哪些渠道 / 怎么展示 / 支持哪些档位 / 有哪些运维旋钮」，
# **不描述怎么处理** —— 处理逻辑在代码里（engine 里注册的 EnhanceProvider 实现）。
#
# 为什么这样切：配置能让一个渠道「上架/下架/改名/调价」，但不能让一个没实现的渠道凭空可用。
# 启动时会逐条校验：
#   · 配置里的渠道没有对应实现 → 启动日志告警，该渠道对用户显示为「未开通」（不可选）
#   · 配置里的档位实现不认识   → 同样告警并剔除该档位
# 这样运维改错配置的后果是「少一个选项 + 日志里一行告警」，而不是整站起不来或线上莫名失败。
#
# 改完这个文件不需要重新构建镜像（configs 是挂载卷），执行：
#   ./deploy.sh config      # 服务器上：重启后端进程以重新加载
#   ./scripts/deploy-local.sh config   # 本机同步 + 上面那步
#
# 计费：档位单价不写在这里，走 model_prices 表（node_type=enhance，运营后台价格管理），
# 与模型价格同一套账、同一个后台页面。
# ============================================

channels:
  # ---------- 本机 FFmpeg（P0，已开通，零成本）----------
  - id: ffmpeg                        # 必须与代码里注册的实现名一致（engine.RegisterEnhanceImpl）
    label: "本机 FFmpeg"
    description: "本机处理：去块 + 轻降噪 + 锐化，可把短边不足 720p 的放大到 720p。不额外扣积分、不补帧、素材不出境"
    enabled: true
    modes:
      - id: clean                     # 档位 ID：写进节点数据，上线后不要改
        label: "标准"
        description: "去块 + 轻降噪 + 锐化，分辨率不变（压掉压缩伪影，画面变干净）"
      - id: hd
        label: "增强"
        description: "标准档 + 短边不足 720p 的用 lanczos 放大到 720p（480p 出片也能凑到 720p 观感）"
        default: true                 # 节点上没写档位时用这一档
        params:
          target_short_side: 720      # 放大目标短边（本机档实现会读这里）

  # ---------- P1：云端渠道（实现还没写，先留着骨架，enabled: false 时不上架）----------
  # 需要先在 engine 里实现并注册同名 provider（腾讯云 MPS 的超分/补帧模板），
  # 再把 enabled 改成 true；价格到 model_prices 里配 node_type=enhance。
  # - id: mps
  #   label: "腾讯云 MPS"
  #   description: "云端超分 / 补帧（按输出秒数计费，素材会上传到云端）"
  #   enabled: false
  #   modes:
  #     - { id: sr,     label: "超分", description: "云端超分辨率，细节更实" }
  #     - { id: interp, label: "补帧", description: "24/30fps 补到 60fps，动作更顺" }

# ---------- 运维旋钮 ----------
# 本机档是纯 CPU 长任务：这些值直接决定「多久能出结果」和「机器会不会被吃满」。
# 它们以前硬编码在 enhance_lite.go 里，线上遇到长片或机器吃紧时只能改代码重新构建 ——
# 现在改这里 + ./deploy.sh config 即可。
limits:
  max_duration_seconds: 120   # 源片时长上限：超了直接拒绝（提示先剪切），避免一个 10 分钟片子闷跑半小时
  timeout_seconds: 300        # 单次处理超时
  max_concurrency: 2          # 同时处理数：机器吃紧调到 1，机器强可以调 3-4
  crf: 20                     # 输出质量（越小越清晰、文件越大）
  preset: veryfast            # x264 预设：越快越糊，veryfast 是画质/耗时平衡点

  # 注意：ffmpeg 滤镜链本身**刻意不做成配置**。
  # 开放滤镜链等于允许在线上拼出跑不通甚至危险的参数组合，出问题还查不到源头；
  # 滤镜链属于实现细节，要换滤镜就改代码、走发版评审。