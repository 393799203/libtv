services:
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8880:80"
    depends_on:
      - backend
    networks:
      - libtv-network
    restart: always

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "38080:8080"   # 备案期用非 Web 端口规避 80/443/8080 拦截；ICP 备案后建议改回 80
    environment:
      - TZ=Asia/Shanghai
      - DB_HOST=db
      - REDIS_HOST=redis
      - RUN_MODE=docker
      # 存储：fallback = ZOS 优先、本地降级（配了 ZOS_* 自动优先 ZOS）；也可直接 zos
      - STORAGE_TYPE=fallback
      # ---- ZOS 配置（天翼云对象存储，S3 协议）----
      - ZOS_ENDPOINT=huadong-1.ctyunzos.cn                # 终端节点 Endpoint
      - ZOS_PUBLIC_ENDPOINT=https://manwa.huadong-1.ctyunzos.cn   # Bucket 外网访问域名
      - ZOS_ACCESS_KEY=3a420edbac8f43bdb2cdc28f92047021   # AccessKey ID
      - ZOS_SECRET_KEY=e7aefebfd4c64b9d94b2908161a307b1   # AccessKey Secret
      - ZOS_BUCKET=manwa
      - ZOS_USE_SSL=true
      # ---- MinIO 配置（保留，未用时忽略）----
      # - MINIO_ENDPOINT=192.168.110.207:9000
      # - MINIO_PUBLIC_ENDPOINT=http://39.171.58.10:9990
      # - MINIO_ACCESS_KEY=admin
      # - MINIO_SECRET_KEY=password123
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - libtv-network
    restart: always
    volumes:
      - uploads-data:/app/uploads
      - public-data:/app/public
      - ./alipay:/app/alipay:ro   # 支付宝支付密钥（私钥/公钥 PEM，挂载进容器，不进镜像）
      # 配置挂载：宿主机修改 configs/ 后重启容器即生效（无需重建镜像/复制进容器）
      - ./server/configs:/app/configs:ro

  # 注：原 MinIO 方案的 extra_hosts（minio-host）已移除——ZOS 走公网，无需宿主机映射

  db:
    image: postgres:15-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=libtv
      - POSTGRES_USER=libtv
      - POSTGRES_PASSWORD=libtv123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - libtv-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libtv -d libtv"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:6379:6379"
    # 必须设置密码：Redis 7 的 protected-mode 在「无密码」时只接受 loopback 连接，
    # 后端容器经 Docker 网络访问会被拒（connection reset by peer）。
    # 端口仅绑宿主机 127.0.0.1；密码需与 server/configs/config.yaml 的 redis.password 一致
    command: redis-server --appendonly yes --requirepass libtv-redis-2026
    environment:
      # 供 healthcheck 里的 redis-cli 自动鉴权（避免在命令行出现明文密码）
      - REDISCLI_AUTH=libtv-redis-2026
    volumes:
      - redis-data:/data
    networks:
      - libtv-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  libtv-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  uploads-data:
  public-data:
