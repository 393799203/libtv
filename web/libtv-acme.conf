# certbot --webroot 续期时把校验文件写进宿主机 /opt/libtv/certbot/www，
# 再只读挂载到容器内 /var/www/certbot（见 docker-compose.yml 的 frontend.volumes）。
# 用 ^~ 前缀匹配保证优先级高于跳转规则。
#
# 两个 80 server 块都 include 本文件：这样给**新子域**签证书时（该域名还没写进
# server_name、请求会落到 default_server），校验文件一样能取到，不会因为返回
# 首页/跳转导致签发失败。
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
}