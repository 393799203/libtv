# ---------------------------------------------------------------------------
# libtv 前端入口
#   80  ：仅 ACME 校验 + 301 跳 HTTPS（不提供任何明文页面内容）
#   443 ：唯一正式入口，Let's Encrypt 证书（yunqueai.cloud / www / manwa 共一张）
#
# 应用本体在 manwa.yunqueai.cloud；裸域与 www 目前同机同应用（apex 之后可能改作他用，
# 那时把它的 server_name 从这里摘掉即可，不影响证书之外的部分）。
#
# 证书由宿主机 certbot 管理，/etc/letsencrypt 与 webroot 目录只读挂进容器
# （见 docker-compose.yml 的 frontend.volumes）。
# 容器内 nginx 为 1.24.0：HTTP/2 只能用 `listen 443 ssl http2;`，
# `http2 on;` 是 1.25.1+ 的写法，写在这里会直接启动失败。
#
# 曾经的 8880 明文入口已移除（备案期遗留）；如需临时恢复，加回一个
# `listen 8880;` + `include /etc/nginx/libtv-app.conf;` 的 server 块并在
# docker-compose.yml 里映射 "8880:80" 即可。
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name yunqueai.cloud www.yunqueai.cloud manwa.yunqueai.cloud;

    include /etc/nginx/libtv-acme.conf;

    # 域名一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 80 上其余 Host（直连 IP、未知子域等）：不返回任何明文内容，统一跳到正式入口。
# 走 301 而不是断连，是为了让误输 IP 的人也能落到 HTTPS 站点上。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/libtv-acme.conf;

    location / {
        return 301 https://manwa.yunqueai.cloud$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yunqueai.cloud www.yunqueai.cloud manwa.yunqueai.cloud;

    ssl_certificate     /etc/letsencrypt/live/yunqueai.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yunqueai.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_session_cache / ssl_session_timeout 不要在这里声明：
    # alpine 自带的 /etc/nginx/nginx.conf 已在 http 层声明
    # `shared:SSL:2m` 与 `1h`，同名共享内存区重复声明会让 nginx 直接启动失败
    # （emerg: the size ... of shared memory zone "SSL" conflicts）。

    # HSTS 先不开：一旦开启，浏览器在 max-age 内会强制 HTTPS，
    # 需要临时回退到明文入口时会很麻烦。确认长期只走 HTTPS 后再放开。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/libtv-app.conf;
}